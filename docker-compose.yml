services:
  postgres:
    image: postgres:16-alpine
    container_name: paroquia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paroquia
    ports:
      - '5432:5432'
    volumes:
      - paroquia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d paroquia']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  paroquia_pgdata: